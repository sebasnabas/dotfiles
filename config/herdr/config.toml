# herdr configuration, ported from config/tmux/tmux.conf.
# Colours are bombadil template variables from vars/gruvbox*.toml.
# See https://herdr.dev/docs/configuration/ for the full reference.

onboarding = false

[keys]
# tmux: unbind C-b; set -g prefix C-q
prefix = "ctrl+q"

# tmux: C-h/j/k/l via vim-tmux-navigator. herdr has no vim-aware equivalent,
# so neovim keeps C-h/j/k/l for its own splits and herdr takes ctrl+alt.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# tmux: bind-key -r H/L select-window -t :-/:+
previous_tab = ["prefix+p", "prefix+shift+h"]
next_tab = ["prefix+n", "prefix+shift+l"]

# tmux: bind-key -r J/K swap-pane -D/-U. Left/right are unbound because
# prefix+shift+h/l now select tabs.
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_left = ""
swap_pane_right = ""

# tmux: bind v split-window -h (side by side), bind h split-window -v (stacked).
# prefix+h is pane focus here, so the stacked split keeps the herdr default.
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# tmux: unbind [; bind Escape copy-mode
copy_mode = ["prefix+[", "prefix+esc"]

[terminal]
# tmux: bind h/v split-window -c "#{pane_current_path}"
new_cwd = "follow"

[theme]
name = "gruvbox"
auto_switch = false

# Ported from config/tmux/theme.conf so herdr matches config/ghostty/config.
[theme.custom]
panel_bg = "{{dark0}}"
sidebar_bg = "{{dark0}}"
active_row_bg = "{{dark2}}"
selection_bg = "{{dark4}}"
surface0 = "{{dark1}}"
surface1 = "{{dark2}}"
surface_dim = "{{dark0_soft}}"
overlay0 = "{{dark4}}"
overlay1 = "{{light4}}"
text = "{{light1}}"
subtext0 = "{{light4}}"
accent = "{{neutral_aqua}}"
red = "{{neutral_red}}"
green = "{{neutral_green}}"
yellow = "{{neutral_yellow}}"
blue = "{{neutral_blue}}"
mauve = "{{neutral_purple}}"
teal = "{{neutral_aqua}}"
peach = "{{neutral_orange}}"

[ui]
accent = "{{neutral_aqua}}"

# Distinct glyphs rather than colour dots for agent state.
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

# tmux-style splitters: panes share a single divider line and the pane area
# has no outer frame, instead of each pane being drawn as a separate box.
pane_gaps = false
pane_outer_borders = false

# tmux put its status bar at the bottom.
tab_bar_position = "bottom"

# tmux: set-option -g set-titles-string "#S - #I  #W"
window_title = "{workspace} - {tab}"

# tmux never prompted for a window name.
prompt_new_tab_name = false

# tmux: set -g status-right, showing date, time and hostname.
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%Y-%m-%d  %H:%M" },
  { type = "hostname" },
]
tab_bar_right_separator = " | "

[ui.toast]
delivery = "system"

[experimental]
# tmux: set -g allow-passthrough on, for yazi image previews.
kitty_graphics = true
