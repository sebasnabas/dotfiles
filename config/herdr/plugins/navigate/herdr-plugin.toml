# vim-tmux-navigator's multiplexer half, as a herdr plugin.
#
# A plugin rather than a [[keys.command]] type = "shell" entry because herdr
# runs custom commands through /bin/sh -lc, and the login shell cost about
# 100ms per keypress. Plugin actions are spawned as argv with no shell.
#
# Register once per machine, from the repo checkout:
#   herdr plugin link ~/Projects/dotfiles/config/herdr/plugins/navigate
#
# config/herdr/config.toml binds the four directional actions to ctrl+h/j/k/l
# and the global jump to prefix+backtick.
id = "seb.navigate"
name = "Navigate"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Pane navigation that cooperates with neovim, and a jump to the agent waiting on you"
platforms = ["linux"]

[[actions]]
id = "left"
title = "Focus or forward left"
contexts = ["pane"]
command = ["./navigate", "left"]

[[actions]]
id = "down"
title = "Focus or forward down"
contexts = ["pane"]
command = ["./navigate", "down"]

[[actions]]
id = "up"
title = "Focus or forward up"
contexts = ["pane"]
command = ["./navigate", "up"]

[[actions]]
id = "right"
title = "Focus or forward right"
contexts = ["pane"]
command = ["./navigate", "right"]

[[actions]]
id = "last-waiting-agent"
title = "Focus the agent waiting on you, blocked before finished"
contexts = ["global"]
command = ["./last-waiting-agent"]
